# App configuration
name = "Discounty"
client_id = "REPLACE_WITH_REAL_CLIENT_ID"
application_url = "https://YOUR-CLOUDFLARE-URL.trycloudflare.com"
embedded = true

# Access scopes
[access_scopes]
scopes = "read_products,write_products,read_discounts,write_discounts"

# Auth settings
[auth]
redirect_urls = [
  "https://YOUR-CLOUDFLARE-URL.trycloudflare.com/auth/callback",
  "https://YOUR-CLOUDFLARE-URL.trycloudflare.com/auth/shopify/callback",
  "https://YOUR-CLOUDFLARE-URL.trycloudflare.com/api/auth/callback"
]

# Webhooks
[webhooks]
api_version = "2024-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["discounts/delete"]
  uri = "/webhooks/discounts/delete"

  [[webhooks.subscriptions]]
  topics = ["discounts/update"]
  uri = "/webhooks/discounts/update"

# ✅ FIXED APP PROXY
[app_proxy]
url = "https://YOUR-CLOUDFLARE-URL.trycloudflare.com/api/proxy"
subpath = "smartdiscounts"
prefix = "apps"

# POS
[pos]
embedded = false