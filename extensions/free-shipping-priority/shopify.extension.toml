api_version = "2026-04"

[[extensions]]
name = "t:name"
handle = "free-shipping-priority"
type = "function"
uid = "2499f571-6531-231a-1a1b-cb4974fd6657efc6d560"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [[extensions.targeting]]
  target = "cart.delivery-options.discounts.generate.run"
  input_query = "src/cart_delivery_options_discounts_generate_run.graphql"
  export = "cart-delivery-options-discounts-generate-run"

  # Populates input-query variables from a JSON metafield on the discount.
  # Top-level keys of that metafield bind to same-named query variables, which is
  # how `collectionIds` reaches $collectionIds in
  # src/cart_lines_discounts_generate_run.graphql. This is declared once for the
  # whole extension, not per target — hence both campaign types share one
  # namespace/key and are told apart by the `kind` field inside the config.
  [extensions.input.variables]
  namespace = "$app:smartsavings"
  key = "config"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
